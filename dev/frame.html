<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>frame</title>
<style>html,body{margin:0;background:#888}iframe{display:block;border:0;width:390px;height:844px;background:#fff}</style></head>
<body><iframe id="f"></iframe>
<script>
/* スマホ幅（390px）で preview.html を表示する。スクリーンショット確認用（公開不要）。 ?h=高さ&その他は preview.html に渡す */
var p = new URLSearchParams(location.search), f = document.getElementById("f");
if (p.get("h")) { f.style.height = p.get("h") + "px"; p.delete("h"); }
f.src = "preview.html?" + p.toString();
</script></body></html>
